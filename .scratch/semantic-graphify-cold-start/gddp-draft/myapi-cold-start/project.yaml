schema_version: "1.0"
schema_type: project_graph
project_id: myapi-cold-start
project_name: MyAPI Semantic Graphify Cold-Start
description: >
  Thin path to agent cold-start: Khoj-backed MyAPI with two MCP tools
  (get_project_context, get_person_context) plus first-class /query with
  agent-facing args/examples. Prove on MyAPI. Meaning over AST. Reuse existing
  engine. New graph — not the old six-node myapi scaffold.
repo: skchaudr/MyAPI
blueprint:
  vision: >
    In 30–90s agents hit MCP/API like Graphify and get where we are, what’s true,
    what’s open, what’s dangerous — grounded or explicitly weak/empty.
  architecture_notes: >
    Khoj = search backend. Context Refinery + /query = engine. MCP = thin doorway
    (two tools). Briefs prefer status/decisions/open risks with evidence paths.
    Structure questions stay with Graphify/repo. Draft lives in MyAPI
    .scratch/semantic-graphify-cold-start/ until copied into gddp-config.
  major_capabilities:
    - rebuild surface on build tip
    - agent /query contract
    - project context brief
    - person context brief
    - live two-tool MCP
    - eight-question MyAPI cold-start proof
graph_version: "1.0"
